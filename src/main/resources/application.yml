spring:
  application:
    name: schema-jdbc
  datasource:
    url: jdbc:h2:mem:crs;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
  sql:
    init:
      mode: never
server:
  port: 8080
